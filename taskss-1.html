<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Details Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            padding: 40px 20px;
            color: #1e293b;
        }

        .container {
            width: 100%;
            max-width: 450px;
            margin: 0 auto 40px;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        .form {
            display: flex;
            flex-direction: column;
        }

        .form label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #334155;
        }

        .form input {
            width: 100%;
            height: 44px;
            padding: 10px 12px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
            background: #f8fafc;
        }

        .form input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
            background: white;
        }

        .form button {
            width: 100%;
            padding: 13px;
            margin-bottom: 10px;
            border: none;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        #submitBtn {
            background: #2563eb;
            color: white;
        }

        #submitBtn:hover {
            background: #1d4ed8;
        }

        #resetBtn {
            background: #e2e8f0;
            color: #334155;
        }

        #resetBtn:hover {
            background: #cbd5e1;
        }

       .table-container {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    overflow-x: auto;
    background: white;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: auto;
}

thead {
    background: #2563eb;
    color: white;
}

th, td {
    padding: 15px 12px;
    text-align: center;
    border: 1px solid #e2e8f0;
    font-size: 14px;
}

th {
    white-space: nowrap;
}

td {
    overflow-wrap: anywhere;
}

@media (max-width: 600px) {
    .table-container {
        max-width: 100%;
    }

    table {
        min-width: 750px;
    }
}

    </style>
</head>

<body>


    <div class="container">
    <h1 class="title">Hello World!</h1>

    <form action="" class="form">
        <label for="userName">UserName</label>
        <input type="text" id="userName">

        <label for="emailId">Email ID</label>
        <input type="email" id="emailId">

        <label for="phone">Phone NO</label>
     <input type="number" id="phone">

        <label for="address">Address</label>
        <input type="text" id="address">

        <button type="submit" id="submitBtn">Submit</button>
        <button type="reset" id="resetBtn">Reset</button>
    </form>
</div>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>User Name</th>
                <th>User Email ID</th>
                <th>User Mobile No</th>
                <th>User Address</th>
                <th>Edit Action</th>
                <th>Delete Action</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>
</div>



<script src="scripteeee.js"></script>
</body>
</html>
